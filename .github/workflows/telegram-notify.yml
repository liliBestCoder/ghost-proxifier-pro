name: Release Telegram Notification

on:
  workflow_dispatch:

jobs:
  telegram-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Render release notes and send Telegram message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 .github/scripts/telegram_notify.py
