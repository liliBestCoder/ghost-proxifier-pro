    <style>
        :root {
            --ACCENT-BLUE: #58a6ff;
            --TEXT-MAIN: #c9d1d9;
            --TEXT-MUTED: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;

        /* 轮播外容器 */
        .ad-slider {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 单个广告卡片样式 */
        .ad-card {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(88, 166, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px;
            cursor: pointer;
            color: var(--TEXT-MAIN);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            /* 默认隐藏，配合淡入淡出动画 */
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out, visibility 0.6s;
            pointer-events: none;
        }

        /* 呼吸发光动画 */
        @keyframes border-glow {
            0% {
                border-color: rgba(88, 166, 255, 0.2);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 4px rgba(88, 166, 255, 0.05);
            }

            100% {
                border-color: rgba(88, 166, 255, 0.4);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(88, 166, 255, 0.2);
            }
        }

        /* 激活（显示）的广告卡片 */
        .ad-card.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
            animation: border-glow 3s infinite alternate ease-in-out;
        }

        /* 悬停发光 */
        .ad-card:hover {
            transform: translateY(-2px);
            border-color: var(--ACCENT-BLUE);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.25), 0 0 15px rgba(88, 166, 255, 0.15);
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            animation: none;
        }

        /* 赞助商标签 */
        .sponsored-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 10px;
            color: var(--ACCENT-BLUE);
            background: rgba(88, 166, 255, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 1px solid rgba(88, 166, 255, 0.2);
            transition: all 0.3s;
        }

        .ad-card:hover .sponsored-badge {
            background: var(--ACCENT-BLUE);
            color: #0d1117;
            border-color: var(--ACCENT-BLUE);
        }

        /* 标题样式 */
        .ad-title {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 16px;
            margin-bottom: auto;
            letter-spacing: 1px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* 底部信息 */
        .ad-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .ad-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ACCENT-BLUE);
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .ad-card:hover .ad-icon-wrapper {
            background: var(--ACCENT-BLUE);
            color: #0d1117;
            border-color: var(--ACCENT-BLUE);
            transform: scale(1.05) rotate(15deg);
        }

        .ad-desc {
            font-size: 11px;
            color: var(--TEXT-MUTED);
            line-height: 1.4;
            font-weight: 600;
        }

        .ad-card:hover .ad-desc {
            color: #ffffff;
        }

        /* 底部指示器 (Dots) */
        .slider-dots {
            position: absolute;
            bottom: 12px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.active {
            background: var(--ACCENT-BLUE);
            width: 14px;
            /* 横向拉伸效果 */

        /* 广告容器布局 */
        .ad-container {

        .ad-badge {

            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(88, 166, 255, 0.12);
            color: var(--ACCENT-BLUE);
            border: 1px solid rgba(88, 166, 255, 0.25);
            line-height: 1.1;
            text-transform: uppercase;
        }

        .ad-slider {
            position: relative;
            width: 100%;
            flex: 1;
        }
    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.ad-card');
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide = index;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        function nextSlide() {
            let nextIndex = (currentSlide + 1) % slides.length;
            showSlide(nextIndex);
        }

        // 默认每隔 5 秒切换一次广告
        setInterval(nextSlide, 5000);

        // 拦截点击事件，向父级窗口发送消息以便通过外部默认浏览器打开链接
        document.addEventListener('click', function(e) {
            const anchor = e.target.closest('a');
            if (anchor && anchor.href) {
                e.preventDefault();
                window.parent.postMessage({ type: 'openLink', url: anchor.href }, '*');
            }
        });
    </script>
