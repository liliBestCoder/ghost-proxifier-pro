    <title>Ghost Proxifier Sponsored Ads</title>
    <!-- 统计埋点 (PostHog 原生 fetch + 国内 IP 探测 + 从 localStorage 读取百度 Hm_lvt_ 首次访问时间) -->
    <script>
        (function () {
            function getOrCreateGlobalVisitorId() {
                var storageKey = 'global_visitor_id';
                var gvid = '';
                try { gvid = localStorage.getItem(storageKey); } catch (e) { }
                if (!gvid) {
                    var randStr = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
                        ? crypto.randomUUID()
                        : (Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 10) + '-' + Math.random().toString(36).substring(2, 10));
                    gvid = 'gvid-' + randStr;
                    try { localStorage.setItem(storageKey, gvid); } catch (e) { }
                }
                return gvid;
            }

            function getBaiduFirstVisitTime() {
                try {
                    for (var k = 0; k < localStorage.length; k++) {
                        var key = localStorage.key(k) || '';
                        if (key.indexOf('Hm_lvt_') === 0) {
                            var val = localStorage.getItem(key) || '';
                            if (val) {
                                var parts = val.replace(/%2C/gi, ',').split(/[|,]/);
                                for (var p = 0; p < parts.length; p++) {
                                    var ts = parseInt(parts[p].trim(), 10);
                                    if (!isNaN(ts) && ts > 1000000000) {
                                        if (ts > 100000000000) { ts = Math.floor(ts / 1000); }
                                        return {
                                            raw_cookie: val,
                                            first_ts: ts,
                                            first_time_str: new Date(ts * 1000).toISOString()
                                        };
                                    }
                                }
                            }
                        }
                    }
                } catch (e) { }
                return null;
            }

            var gvid = getOrCreateGlobalVisitorId();
            var bdInfo = getBaiduFirstVisitTime();
            var posthogToken = 'phc_nF89Du7x954MRygk3pGNsnJ3GUdTZGeTKXXdnmJmwi9M';

            function sendPostHogEvent(realIp) {
                var properties = {
                    global_visitor_id: gvid,
                    real_ip: realIp || '',
                    version: 'v1.1.5',
                    current_url: window.location.href
                };

                if (realIp) {
                    properties['$ip'] = realIp;
                }

                if (bdInfo) {
                    properties.baidu_first_visit_ts = bdInfo.first_ts;
                    properties.baidu_first_visit_time = bdInfo.first_time_str;
                    properties.baidu_lvt_raw = bdInfo.raw_cookie;
                }

                var payload = {
                    token: posthogToken,
                    event: '$pageview',
                    distinct_id: gvid,
                    properties: properties
                };

                try {
                    fetch('https://us.i.posthog.com/capture/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }).catch(function () { });
                } catch (e) { }
            }

            function getRealIp(callback) {
                try {
                    fetch('https://myip.ipip.net/s')
                        .then(function (res) { return res.text(); })
                        .then(function (text) {
                            var ip = text ? text.trim() : '';
                            if (ip && ip.indexOf('.') !== -1 && ip !== '127.0.0.1') {
                                callback(ip);
                            } else {
                                fallbackBaiduIp(callback);
                            }
                        })
                        .catch(function () { fallbackBaiduIp(callback); });
                } catch (e) {
                    fallbackBaiduIp(callback);
                }
            }

            function fallbackBaiduIp(callback) {
                try {
                    fetch('https://opendata.baidu.com/api.php?query=ip&co=&resource_id=6006&oe=utf8')
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            var ip = (data && data.data && data.data[0] && data.data[0].origip) ? data.data[0].origip.trim() : '';
                            if (ip && ip !== '127.0.0.1') {
                                callback(ip);
                            } else {
                                fallbackTencentIp(callback);
                            }
                        })
                        .catch(function () { fallbackTencentIp(callback); });
                } catch (e) {
                    fallbackTencentIp(callback);
                }
            }

            function fallbackTencentIp(callback) {
                try {
                    fetch('https://r.inews.qq.com/api/ip2location')
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            var ip = (data && (data.ip || data.client_ip)) ? (data.ip || data.client_ip).trim() : '';
                            callback((ip && ip !== '127.0.0.1') ? ip : '');
                        })
                        .catch(function () { callback(''); });
                } catch (e) {
                    callback('');
                }
            }

            getRealIp(function (realIp) {
                sendPostHogEvent(realIp);
            });
        })();
    </script>

            color: var(--TEXT-MAIN);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

            /* 默认隐藏，配合淡入淡出动画 */
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out, visibility 0.6s;
            pointer-events: none;
        }

        /* 呼吸发光动画 */
        @keyframes border-glow {

                border-color: rgba(88, 166, 255, 0.2);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 4px rgba(88, 166, 255, 0.05);

                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 10px rgba(88, 166, 255, 0.2);

        /* 激活（显示）的广告卡片 */
        .ad-card.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
            animation: border-glow 3s infinite alternate ease-in-out;
        }

        /* 悬停发光 */
        .ad-card:hover {
            transform: translateY(-2px);
            border-color: var(--ACCENT-BLUE);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.25), 0 0 15px rgba(88, 166, 255, 0.15);
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            animation: none;
        }

        /* 赞助商标签 */
        .sponsored-badge {

            right: 12px;
            font-size: 10px;
            color: var(--ACCENT-BLUE);
            background: rgba(88, 166, 255, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 1px solid rgba(88, 166, 255, 0.2);
            transition: all 0.3s;
        }

        .ad-card:hover .sponsored-badge {
            background: var(--ACCENT-BLUE);
            color: #0d1117;
            border-color: var(--ACCENT-BLUE);
        }

        /* 标题样式 */
        .ad-title {
            font-size: 21px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 16px;
            margin-bottom: auto;
            letter-spacing: 1px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* 底部信息 */
        .ad-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .ad-icon-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ACCENT-BLUE);
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .ad-card:hover .ad-icon-wrapper {
            background: var(--ACCENT-BLUE);
            color: #0d1117;
            border-color: var(--ACCENT-BLUE);
            transform: scale(1.05) rotate(15deg);
        }

        .ad-desc {
            font-size: 11px;
            color: var(--TEXT-MUTED);
            line-height: 1.4;
            font-weight: 600;
        }

        .ad-card:hover .ad-desc {
            color: #ffffff;
        }

        /* 底部指示器 (Dots) */
        .slider-dots {
            position: absolute;
            bottom: 12px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.active {
            background: var(--ACCENT-BLUE);
            width: 14px;
            /* 横向拉伸效果 */
            border-radius: 3px;
        }

        /* 广告容器布局 */
        .ad-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding-bottom: 2px;
        }

        .ad-header-title {
            font-size: 11px;
            color: var(--TEXT-MUTED);

            padding-left: 2px;
            display: flex;
            align-items: center;

            user-select: none;
            font-weight: 500;
        }

        .ad-badge {

            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(88, 166, 255, 0.12);
            color: var(--ACCENT-BLUE);
            border: 1px solid rgba(88, 166, 255, 0.25);
            line-height: 1.1;
            text-transform: uppercase;
        }

        .ad-slider {
            position: relative;
            width: 100%;
            flex: 1;
        }
    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.ad-card');
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide = index;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        function nextSlide() {
            let nextIndex = (currentSlide + 1) % slides.length;
            showSlide(nextIndex);
        }

        // 默认每隔 5 秒切换一次广告
        setInterval(nextSlide, 5000);

        // 拦截点击事件，向父级窗口发送消息以便通过外部默认浏览器打开链接
        document.addEventListener('click', function (e) {
            const anchor = e.target.closest('a');
            if (anchor && anchor.href) {
                e.preventDefault();
                window.parent.postMessage({ type: 'openLink', url: anchor.href }, '*');
            }
        });
    </script>
